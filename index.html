<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#171a1b">
    <title>DIU CSE Routine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-user-graduate"></i></div>
            <strong>Student</strong>
        </div>
        <div class="header-actions">
            <span id="statusBadge" class="status"><i class="fas fa-circle"></i><span id="statusText">Loading</span></span>
            <button class="icon-btn" aria-label="Messages"><i class="fas fa-comments"></i></button>
            <button class="icon-btn" aria-label="Menu"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <main>
        <section class="search-panel">
            <div class="search-row">
                <div class="search-input-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="sectionInput" placeholder="Enter section" value="70_N" autocomplete="off">
                </div>
                <select id="departmentSelect" aria-label="Department">
                    <option>CSE</option>
                </select>
            </div>
            <div class="saved-chip" id="savedChip" title="Current section">
                <span id="savedSection">70_N</span><button id="clearSectionBtn" aria-label="Clear saved section">×</button>
            </div>
            <button id="showRoutineBtn" class="sr-only">Show Routine</button>
            <div id="message" role="status"></div>
        </section>

        <section id="routineContainer" class="routine-container">
            <div class="loading-state"><div class="spinner"></div><p>Loading routine data...</p></div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active"><i class="fas fa-user"></i></button>
        <button class="nav-item"><i class="fas fa-address-card"></i></button>
        <button class="nav-item"><i class="fas fa-search"></i></button>
        <button class="nav-item"><i class="fas fa-door-open"></i></button>
    </nav>

    <footer class="desktop-footer">
        <span>Developed with ❤️ by MD. Salah Uddin</span>
        <span>Auto-updates every 3 hours</span>
        <span>Powered by GitHub </span>
        <span class="version">v<span id="versionNumber">5.0</span></span>
        <span id="lastUpdated"></span>
    </footer>
</div>
<script src="./script.js"></script>
</body>
</html>
