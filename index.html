<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIU CSE Routine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-top">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <div>
                        <h1>DAFFODIL INTERNATIONAL UNIVERSITY</h1>
                        <h2>Department of Computer Science & Engineering</h2>
                    </div>
                </div>
                <div class="header-right">
                    <span class="version-badge">v<span id="versionNumber">5.0</span></span>
                    <span id="statusBadge" class="status-badge">
                        <i class="fas fa-circle"></i> <span id="statusText">Loading</span>
                    </span>
                    <span id="lastUpdated" class="last-updated"></span>
                </div>
            </div>
        </header>

        <!-- Search -->
        <section class="search-section">
            <div class="search-box">
                <label><i class="fas fa-user-graduate"></i> Enter your section</label>
                <div class="input-group">
                    <input type="text" id="sectionInput" placeholder="e.g., 70_N, 71_B, 66_E" value="70_N">
                    <button id="showRoutineBtn"><i class="fas fa-eye"></i> Show Routine</button>
                </div>
                <div class="search-actions">
                    <button id="clearSectionBtn" class="clear-btn"><i class="fas fa-undo"></i> Clear saved routine</button>
                    <span id="message" class="message"></span>
                </div>
            </div>
        </section>

        <!-- Routine Display -->
        <section id="routineContainer" class="routine-container">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading routine data...</p>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <div class="footer-content">
                <span><i class="fas fa-database"></i> LocalStorage • No Database</span>
                <span><i class="fas fa-sync-alt"></i> Auto-updates every 3 hours</span>
                <span><i class="fas fa-shield-alt"></i> Powered by GitHub Actions</span>
            </div>
        </footer>
    </div>

    <script src="./script.js"></script>
</body>
</html>
