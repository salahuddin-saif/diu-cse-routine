<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIU CSE Routine</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DAFFODIL INTERNATIONAL UNIVERSITY</h1>
            <h2>DIU CSE Routine</h2>
            <div id="statusBar">
                <span id="status">● Loading</span>
                <span id="lastUpdated"></span>
            </div>
        </header>

        <main>
            <div class="search-section">
                <label for="sectionInput">Enter your section</label>
                <div class="input-group">
                    <input type="text" id="sectionInput" placeholder="e.g., 70_B71_B70_P">
                    <button id="showRoutine">Show Routine</button>
                </div>
                <button id="clearSection">Clear saved routine</button>
                <div id="message"></div>
            </div>

            <div id="routineContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading routine data...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="./script.js"></script>
</body>
</html>
