name: Update DIU CSE Routine

on:
  schedule:
    # Runs every 3 hours
    - cron: "17 */3 * * *"
  workflow_dispatch:
    # Allows manual triggering

permissions:
  contents: write

jobs:
  update-routine:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run scraper
        id: scraper
        run: |
          python scraper.py
        continue-on-error: true
        
      - name: Check if data was updated
        id: check_update
        run: |
          if git status --porcelain | grep -q "data/routine.json"; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push if updated
        if: steps.check_update.outputs.updated == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/routine.json
          git commit -m "Update routine data [skip ci]"
          git push
          
      - name: Log success
        if: steps.check_update.outputs.updated == 'true'
        run: |
          echo "✅ Routine data updated successfully"
          
      - name: Log no changes
        if: steps.check_update.outputs.updated == 'false'
        run: |
          echo "ℹ️ No changes detected in routine data"
