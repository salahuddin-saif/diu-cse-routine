name: Update DIU CSE Routine

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-routine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF requests beautifulsoup4

      - name: Download latest routine PDF
        env:
          ROUTINE_PDF_URL: ${{ secrets.ROUTINE_PDF_URL }}
        run: |
          if [ -z "$ROUTINE_PDF_URL" ]; then
            echo "Error: ROUTINE_PDF_URL secret not set"
            exit 1
          fi
          mkdir -p data
          curl -L -o data/routine.pdf "$ROUTINE_PDF_URL"

      - name: Parse PDF to JSON
        run: |
          python scripts/parse_routine_pdf.py data/routine.pdf data/routine.json

      - name: Check for changes
        id: check
        run: |
          if git status --porcelain | grep -q "data/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "Update routine data [skip ci]"
          git pull origin main --no-rebase --strategy-option=ours
          git push origin main
