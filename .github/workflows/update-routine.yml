name: Update DIU CSE Routine

on:
  schedule:
    # Runs at minute 17 past every 3rd hour (e.g., 00:17, 03:17, 06:17, ...)
    - cron: "17 */3 * * *"
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

permissions:
  contents: write

jobs:
  update-routine:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Fetch all history for proper version detection

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the scraper
      - name: Run scraper
        run: python scraper.py

      # 5. Check if any files in data/ have changed
      - name: Check for changes
        id: check
        run: |
          if git status --porcelain | grep -q "data/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # 6. Commit and push if there are changes
      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "Update routine data [skip ci]"
          # Pull with merge strategy 'ours' to keep our local changes if conflicts arise
          git pull origin main --no-rebase --strategy-option=ours
          git push origin main
